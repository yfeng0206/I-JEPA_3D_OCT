data:
  batch_size: 64
  crop_size: 256
  crop_scale:
  - 0.3
  - 1.0
  num_workers: 6
  val_num_workers: 2
  pin_mem: true
  data_dir: D:\jepa_phase0\fairvision-glaucoma\data
  slice_cache_dir: D:\jepa_phase0\fairvision-glaucoma\slice_cache
  num_slices: 100
  color_jitter_strength: 0.0
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
mask:
  patch_size: 16
  num_enc_masks: 1
  num_pred_masks: 4
  enc_mask_scale:
  - 0.85
  - 1.0
  pred_mask_scale:
  - 0.055
  - 0.075
  aspect_ratio:
  - 0.75
  - 1.5
  allow_overlap: false
  pred_target_k: 16
  min_keep: 10
  curriculum:
    enabled: true
    mode: mirage_anatomy
    T_warm: 25
    T_total: 30
    r_max: 1.0
    ramp_shape: linear
    mirage_guide_dir: D:\jepa_phase0\fairvision-glaucoma\mirage_guides
    mirage_dilate_patches: 0
    mirage_min_block_fill: 0.4
    mirage_min_retina_visible: 0.25
    mirage_max_attempts: 30
    mirage_occupancy_threshold: 0.25
    mirage_spread: true
    mirage_overlap_tolerance: 0.25
    anatomy_mass_cap: 0.9
    anatomy_tau: 0.1
meta:
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  load_checkpoint: true
  read_checkpoint: null
optimization:
  epochs: 1
  lr: 0.00025
  start_lr: 0.0001
  final_lr: 1.0e-06
  warmup: 5
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema:
  - 0.996
  - 1.0
  ipe_scale: 1.0
  accum_steps: 8
  save_every: 1
  patience: 9999
logging:
  folder: D:\jepa_phase0\runs\arm_random_matched
  write_tag: jepa_patch_mirage
