data:
  batch_size: 64
  crop_size: 256
  crop_scale:
  - 0.3
  - 1.0
  num_workers: 6
  val_num_workers: 2
  pin_mem: true
  data_dir: D:\jepa_phase0\fairvision-glaucoma\data
  slice_cache_dir: C:\jepa_data\slice_cache
  num_slices: 100
  color_jitter_strength: 0.0
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
  prefetch_factor: 2
mask:
  patch_size: 16
  num_enc_masks: 1
  num_pred_masks: 4
  enc_mask_scale:
  - 0.85
  - 1.0
  pred_mask_scale:
  - 0.15
  - 0.2
  aspect_ratio:
  - 0.75
  - 1.5
  allow_overlap: false
  min_keep: 10
  # pred_target_k is deliberately NOT set.  COVER targets are rectangles of the
  # batch-shared sizes, so every target in a group has the same length and the
  # stock global-min truncation is harmless -- exactly as in the envelope and
  # random arms.  Setting it would change the supervision budget and break the
  # comparison.  (mirage_anatomy needs it only because its blobs are ragged.)
  curriculum:
    enabled: true
    mode: mirage_cover
    # Same ramp window the envelope and oracle arms used when they forked at
    # ep25, so the ep26-30 losses are compared like for like.
    T_warm: 25
    T_total: 30
    r_max: 1.0
    ramp_shape: linear
    mirage_guide_dir: C:\jepa_data\mirage_soft_guides\base512_enc_ad4f09adfa9f05f0b_m31a932eef403c3e8_npy
    mirage_dilate_patches: 0
    mirage_occupancy_threshold: 0.25
    # --- COVER knobs ---
    # leave_frac is the SOFT stop; min_visible_* are HARD floors that keep the
    # encoder anchored on some tissue.  tau is shared with the anatomy arm so
    # "what counts as anatomy" is defined identically across arms.
    anatomy_tau: 0.1
    cover_leave_frac: 0.21
    cover_min_visible_frac: 0.21
    cover_min_visible_cells: 4
    # Leftover blocks (those not needed for coverage) are placed as PLAIN
    # uniform I-JEPA rectangles rather than boundary-straddling transitions --
    # but restricted to windows that keep the hard anatomy-visibility floor.
    # Measured over 600 slices: unconstrained uniform placement breaches the
    # 15% floor on 40% of slices; this variant breaches it on 0% at identical
    # anatomy coverage (84.4% hidden), spending on average 2.95 cover blocks
    # and 1.05 random blocks of the 4.
    cover_transition: true
    cover_fill: random_legal
    # Batch-crop policy for the ENCODER mask.  The stock "prefix" crop is a
    # row-major prefix of the sorted context indices, so it always deletes the
    # BOTTOM of the image; on a horizontal retina that removes ALL anatomy from
    # the encoder on 14.4% of slices (envelope, which never touches this arm's
    # code, is hit at 7.4% -- it is a defect in the shared collation path).
    # "window" keeps a CONTIGUOUS run of the same sorted indices, so the context
    # stays one coherent region exactly as in stock I-JEPA, but slides the run
    # to the offset retaining the most anatomy.  Measured at identical coverage
    # (78.8% hidden, unchanged): zero-anatomy context 14.38% -> 1.93%, and
    # anatomy-in-context 9.9% -> 12.5%.  No change to rectangle shape, size,
    # count, or the masking method.
    # enc_truncate: STOCK. `prefix` is what src/masks/multiblock.py does
    # (`_truncate_and_stack`: min_len = min(t.numel()); t[:min_len]) and what
    # random, oracle, envelope and blob were all trained under. It is stock
    # I-JEPA behaviour, NOT a local defect.
    #
    # It does bias spatially: indices are row-major, so `t[:min_len]` keeps the
    # TOP of the image and deletes the BOTTOM. Measured over 6,137 slices it
    # removes 31-36% of encoder context in EVERY rectangle arm including plain
    # random. At floor 0.21 this arm blanks on 7.84% of slices versus
    # envelope's 8.07% (paired McNemar delta -0.23%, z = -0.6: same).
    #
    # The previous run set this to `window`, which picks the crop offset by
    # argmax over the MIRAGE guide. That made it a SECOND anatomy-guided
    # intervention and its AUC deficit could not be attributed. Do not re-enable
    # it unless every comparison arm is retrained with it.
    enc_truncate: prefix
meta:
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  # Run the EMA-teacher forward under fp16 autocast.  Measured: the target
  # forward is 59.4% of the training step in fp32 (257 ms of 433 ms at batch
  # 64); enabling this makes the step 1.66x faster, 68 -> 41 min/epoch, and
  # turns a 28.2 h run into 17.0 h.  Numerically negligible: cosine 1.00000000
  # against the fp32 targets, mean |diff| 2.5e-04 on layer-normed features,
  # versus ~0.4% per-step drift of the EMA teacher itself.  Validation still
  # runs fp32 so val loss stays comparable with the other arms.
  # DISABLED for this comparison.  It is a 1.66x speedup (28.2 h -> 17.0 h) and
  # numerically tiny (cosine 1.00000000, mean |diff| 2.5e-04), but it changes
  # the REGRESSION TARGETS, and random/oracle/envelope/blob were all trained
  # with fp32 targets.  At the ~0.002-0.005 AUC effect sizes being compared, a
  # single arm must not differ in how its targets are computed.  Turn on only
  # when every arm in the comparison uses it.
  #
  # PROVENANCE: the archived COVER run ep26->100 (AUC 0.8558/0.8590/0.8612/
  # 0.8607) WAS executed with this set to `true`, in violation of the rule
  # written above.  Its deficit vs random/oracle/envelope is therefore not
  # attributable.  Left at `false` here so any rerun or resume is comparable.
  amp_target: false
  load_checkpoint: true
  # The common ancestor of random, oracle, envelope AND cover.
  read_checkpoint: D:\jepa_phase0\fairvision-glaucoma\checkpoint-ep25\jepa_patch-random_posfix-ep25.pth.tar
  seed: 0
optimization:
  epochs: 100
  lr: 0.00025
  start_lr: 0.0001
  final_lr: 1.0e-06
  warmup: 5
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema:
  - 0.996
  - 1.0
  ipe_scale: 1.0
  accum_steps: 8
  save_every: 5
  patience: 9999
logging:
  folder: D:\jepa_phase0\runs\cover_f021_ep25
  write_tag: jepa_patch_cover_f021
