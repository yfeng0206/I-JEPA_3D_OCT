# ORACLE run (Rung 1) — warm-start from R1 ep25, hard-switch to anatomical_prior.
#
# Tests the thesis gate: does masking the KNOWN glaucoma region (the retinal
# band) beat random masking under JEPA? If oracle <= random, the masking
# thesis is dead and we stop cheap (see docs/experiments/curriculum_masking.md).
#
# Warm-start: set RESUME_BLOB=<blob path to R1 jepa_patch-ep25.pth.tar> so
# run_patch.sh downloads it to meta.read_checkpoint below. The epoch counter
# continues from 25, so curriculum T_warm=25 makes specific masking engage at
# epoch 26 (bootstrap epoch 25 stays r_t=0).
data:
  batch_size: 64
  crop_size: 256
  crop_scale: [0.3, 1.0]
  num_workers: 4
  pin_mem: true
  data_dir: /tmp/fairvision_data/data
  num_slices: 100
  color_jitter_strength: 0.0
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
mask:
  patch_size: 16
  num_enc_masks: 1
  num_pred_masks: 4
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  allow_overlap: false
  min_keep: 10
  # ---- Curriculum: ORACLE anatomical_prior (v2 retina-following band) ----
  curriculum:
    enabled: true
    mode: anatomical_prior
    # Warm-start point = 25 (R1 did random ep0-25). Specific engages ep26.
    T_warm: 25
    # Quick ramp to full-specific over ep25-30 (hard-switch, not instantaneous
    # so we can watch collapse metrics ease in).
    T_total: 30
    r_max: 1.0
    ramp_shape: linear
    # Oracle v2 sizing (see _anatomical_prior_weight_grid_for_image).
    # NOTE: on the 16x16 patch grid, frac 0.28 rounds up to 6 rows x 13 cols =
    # 78/256 = ~30.5% actual region (integer quantization). Still inside the
    # 0.20-0.40 target band. Detector is affine-invariant so it is robust to
    # the ImageNet Normalize the training transform applies.
    oracle_region_frac: 0.28      # at lateral 0.6: 7 rows x 10 cols = 70/256
                                  # = ~27.3% actual bias region (grid rounding)
    oracle_lateral_frac: 0.6      # central 60% of lateral extent: strong
                                  # retina-focus but leaves lateral retinal
                                  # context (masks ~66% of retina, leaves ~34%).
                                  # r_max barely moves this (block size dominates);
                                  # lateral_frac is the real knob. 0.8 = too
                                  # aggressive (ambiguous failure); 0.4-0.5 drifts
                                  # toward a narrow central-lane prior.
    oracle_row_offset: 0.0        # 0 = centred on retinal band; <0 = RNFL focus
    oracle_min_band_rows: 3
meta:
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  load_checkpoint: true
  read_checkpoint: /tmp/ijepa_checkpoints/jepa_patch-r1-ep25.pth.tar
optimization:
  epochs: 100
  lr: 0.00025
  start_lr: 0.0001
  final_lr: 0.000001
  warmup: 5
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]
  ipe_scale: 1.0
  accum_steps: 2
  patience: 9999
logging:
  folder: /tmp/ijepa_outputs/patch_oracle_anatomical
  write_tag: jepa_patch_oracle
