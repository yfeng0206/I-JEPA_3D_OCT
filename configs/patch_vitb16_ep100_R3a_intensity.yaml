# R3a — Intensity-prior dynamic masking (hand-crafted, no learning required).
# Bias pred blocks toward bright (foreground / retina) patches based on the
# per-patch mean of the input image's grayscale intensity (already a useful
# foreground signal in OCT B-scans: vitreous = dark, retina+choroid = bright).
#
# Same ramp + resume schedule as R2.  Per-image biasing — no DDP communication
# needed for the prior itself (only the loss-map EMA + cluster bookkeeping
# uses collectives, and R3a doesn't touch those).
#
# IMPORTANT (lessons_learned.md):
#   #1: keep LR=0.00025
#   General #3: patience=9999

data:
  batch_size: 64
  crop_size: 256
  crop_scale: [0.3, 1.0]
  num_workers: 4
  pin_mem: true
  data_dir: /tmp/fairvision_data/data
  num_slices: 100
  color_jitter_strength: 0.0
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false

mask:
  patch_size: 16
  num_enc_masks: 1
  num_pred_masks: 4
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  allow_overlap: false
  min_keep: 10
  curriculum:
    enabled: true
    mode: intensity_foreground
    T_warm: 25
    T_total: 100
    r_max: 0.5
    ramp_shape: linear
    # Foreground quantile threshold per image: patches whose mean intensity
    # is above this quantile are considered foreground.  0.6 -> top 40%
    # (per MASKING_PLAN.md §6.5 design — more selective than top-half so the
    # hand-crafted prior is a cleaner ablation against the learned R2/R3b).
    intensity_quantile: 0.6

meta:
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  load_checkpoint: true
  read_checkpoint: ./checkpoints/jepa_patch-random_posfix-ep25.pth.tar

optimization:
  epochs: 100
  lr: 0.00025
  start_lr: 0.0001
  final_lr: 0.000001
  warmup: 5
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]
  ipe_scale: 1.0
  accum_steps: 2
  patience: 9999

logging:
  folder: /tmp/ijepa_outputs/patch_vitb16_ep100_R3a_intensity
  write_tag: jepa_patch_R3a
