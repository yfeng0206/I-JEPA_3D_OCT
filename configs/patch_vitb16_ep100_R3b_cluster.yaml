# R3b — Cluster-guided dynamic masking (Self-Guided-MAE-adapted for JEPA).
# Online mini-batch k-means (K=4) over the target_encoder's full unmasked
# (B, 256, 768) grid -> per-patch cluster assignment.  Per-cluster mean
# predictor-loss is tracked as a separate EMA; foreground = top-half
# clusters by loss.  Bias pred blocks toward foreground patches.
#
# K=4 chosen from interpretability heatmap analysis (3-band vitreous/retina/
# choroid structure + retinal sub-split — see MASKING_PLAN.md).
#
# IMPORTANT (lessons_learned.md):
#   #1: keep LR=0.00025
#   #4: curriculum cluster_centroids / cluster_loss_ema must be saved in
#       checkpoint so AML preempt + resume doesn't cold-start (implemented).
#   General #3: patience=9999

data:
  batch_size: 64
  crop_size: 256
  crop_scale: [0.3, 1.0]
  num_workers: 4
  pin_mem: true
  data_dir: /tmp/fairvision_data/data
  num_slices: 100
  color_jitter_strength: 0.0
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false

mask:
  patch_size: 16
  num_enc_masks: 1
  num_pred_masks: 4
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  allow_overlap: false
  min_keep: 10
  curriculum:
    enabled: true
    mode: cluster_foreground
    T_warm: 25
    T_total: 100
    r_max: 0.5
    ramp_shape: linear
    # Cluster geometry + EMA cadence
    K: 4
    cluster_centroid_halflife_steps: 2000
    cluster_loss_halflife_steps: 2000
    # Maturity gate: don't bias until every cluster has been observed
    # enough times.  Prevents biasing toward an under-sampled cluster.
    cluster_maturity_min_count: 64
    # Foreground cluster selection (answers "what if some clusters are
    # useless?" — see MASKING_PLAN.md §6.5):
    #   "top_half":   K/2 hardest clusters by absolute loss EMA (the
    #                 original Self-Guided MAE rule).
    #   "above_mean": clusters whose loss EMA exceeds (mean + z*std);
    #                 robust to "low cluster spread" failure mode where
    #                 K=4 didn't separate semantic groups.  Falls back to
    #                 the single hardest cluster if no cluster qualifies.
    cluster_foreground_selection: above_mean
    foreground_loss_zscore: 0.5

meta:
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  load_checkpoint: true
  read_checkpoint: ./checkpoints/jepa_patch-random_posfix-ep25.pth.tar

optimization:
  epochs: 100
  lr: 0.00025
  start_lr: 0.0001
  final_lr: 0.000001
  warmup: 5
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema: [0.996, 1.0]
  ipe_scale: 1.0
  accum_steps: 2
  patience: 9999

logging:
  folder: /tmp/ijepa_outputs/patch_vitb16_ep100_R3b_cluster
  write_tag: jepa_patch_R3b
