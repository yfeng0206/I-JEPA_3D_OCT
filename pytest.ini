[pytest]
# The active suite lives in tests/.  archive/ holds parked research threads
# whose imports intentionally no longer resolve from their archived location
# (see archive/semantic_teacher_phase0/README.md for the revival steps), so
# collecting it would break a bare `pytest` run from the repo root.
testpaths = tests
norecursedirs = archive .git .venv __pycache__ results logs checkpoints
