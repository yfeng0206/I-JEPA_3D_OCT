data:
  batch_size: 64
  crop_size: 256
  crop_scale:
  - 0.3
  - 1.0
  num_workers: 4
  pin_mem: true
  data_dir: /tmp/fairvision_data/data
  num_slices: 100
  color_jitter_strength: 0.0
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
mask:
  patch_size: 16
  num_enc_masks: 1
  num_pred_masks: 4
  enc_mask_scale:
  - 0.85
  - 1.0
  pred_mask_scale:
  - 0.15
  - 0.2
  aspect_ratio:
  - 0.75
  - 1.5
  allow_overlap: false
  min_keep: 10
  curriculum:
    enabled: true
    mode: anatomical_prior
    T_warm: 25
    T_total: 30
    r_max: 1.0
    ramp_shape: linear
    oracle_region_frac: 0.28
    oracle_lateral_frac: 0.6
    oracle_row_offset: 0.0
    oracle_min_band_rows: 3
meta:
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  use_bfloat16: false
  load_checkpoint: true
  read_checkpoint: /tmp/ijepa_checkpoints/jepa_patch-r1-ep25.pth.tar
optimization:
  epochs: 100
  lr: 0.00025
  start_lr: 0.0001
  final_lr: 1.0e-06
  warmup: 5
  weight_decay: 0.04
  final_weight_decay: 0.4
  ema:
  - 0.996
  - 1.0
  ipe_scale: 1.0
  accum_steps: 2
  patience: 9999
logging:
  folder: /tmp/ijepa_outputs/patch_vit_base_ps16_ep100_bs32_lr0.00025_20260602_093108
  write_tag: jepa_patch_oracle
